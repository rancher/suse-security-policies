name: Repackage a policy

# Repackages a single upstream policy release:
#
#   1. verify the upstream Wasm module signature, pinned to the exact tag
#   2. rewrite its provenance metadata for SUSE
#   3. push the artifact to the destination registry, unsigned
#   4. republish the upstream SBOM, generate the SUSE one and check the
#      release content
#   5. sign the artifact, the module file and the SUSE SBOM, attest the SBOM
#      and verify every signature
#   6. publish a GitHub release carrying the upstream changelog
#
# The SBOMs come after the push, because the SUSE document records the digest
# of the published artifact. Signing comes after every check, so a failed run
# never leaves a signature on something that did not pass.
#
# The GitHub release is created last on purpose: its existence is what the
# discovery workflow uses to decide a version is fully published. If any step
# fails, the last step deletes the release and the artifact this run pushed,
# so the next run retries.

on:
  workflow_call:
    inputs:
      policy-name:
        description: "Upstream policy directory name, for example 'pod-privileged-policy'"
        required: true
        type: string
      policy-id:
        description: "Policy id, the last segment of the ociUrl annotation, for example 'pod-privileged'"
        required: true
        type: string
      version:
        description: "Policy version without the 'v' prefix"
        required: true
        type: string
      tag:
        description: "Upstream release tag, '<policy-name>/v<version>'"
        required: true
        type: string
      upstream-release-url:
        description: "URL of the upstream GitHub release"
        required: true
        type: string

permissions: {}

jobs:
  repackage:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write
    env:
      POLICY_NAME: ${{ inputs.policy-name }}
      POLICY_ID: ${{ inputs.policy-id }}
      POLICY_VERSION: ${{ inputs.version }}
      UPSTREAM_TAG: ${{ inputs.tag }}
      UPSTREAM_RELEASE_URL: ${{ inputs.upstream-release-url }}
    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Install dependencies
        uses: ./.github/actions/install-dependencies

      - name: Read configuration
        id: config
        run: |
          set -euo pipefail
          {
            echo "upstream-repository=$(yq -r '.upstream.repository' config.yaml)"
            echo "upstream-registry=$(yq -r '.upstream.registry' config.yaml)"
            echo "destination-registry=$(yq -r '.destination.registry' config.yaml)"
            echo "oidc-issuer=$(yq -r '.upstream.certificate_oidc_issuer' config.yaml)"
          } >> "$GITHUB_OUTPUT"

          # The identity is pinned to the exact tag being repackaged. A looser
          # pattern would accept any artifact signed by the upstream release
          # workflow, including one for a different policy or version.
          # The identity is a literal string and cosign compares it exactly,
          # so the tag goes in as it is. A regular expression would need every
          # special character of the tag escaped, not only the dots.
          identity=$(yq -r '.upstream.certificate_identity_template' config.yaml)
          identity="${identity//\{tag\}/${UPSTREAM_TAG}}"
          echo "identity=${identity}" >> "$GITHUB_OUTPUT"
          echo "Expected upstream signer identity: ${identity}"

          # The identity of the signatures this workflow makes. It names the
          # main branch, not the ref of this run. A run from another branch
          # then fails its own verification, even if the gate in the caller
          # is removed.
          own_identity="https://github.com/${GITHUB_REPOSITORY}/.github/workflows/repackage-policy.yaml@refs/heads/main"
          echo "own-identity=${own_identity}" >> "$GITHUB_OUTPUT"
          echo "Expected own signer identity: ${own_identity}"

      - name: Log in to the container registry
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ----------------------------------------------------------------------
      # 1. Verify the upstream artifact
      # ----------------------------------------------------------------------

      - name: Verify the upstream policy signature
        id: verify
        env:
          UPSTREAM_REGISTRY: ${{ steps.config.outputs.upstream-registry }}
          IDENTITY: ${{ steps.config.outputs.identity }}
          OIDC_ISSUER: ${{ steps.config.outputs.oidc-issuer }}
        run: |
          set -euo pipefail
          TAG_REF="${UPSTREAM_REGISTRY}/${POLICY_ID}:v${POLICY_VERSION}"

          # Resolve the tag to a digest once, before the verification, and
          # use the digest from here on. If the verification ran on the tag,
          # a tag moved between the verification and the resolution would
          # give a digest that nobody verified.
          REF=$(cosign triangulate --type digest "$TAG_REF")
          if [[ "$REF" != *@sha256:* ]]; then
            echo "::error::Could not resolve ${TAG_REF} to a digest, got '${REF}'"
            exit 1
          fi
          echo "Upstream artifact ${TAG_REF} resolved to ${REF}"

          # Upstream signs every release twice, once in the legacy bundle
          # format and once in the v3 format. Accept either, but require at
          # least one to verify against the pinned identity.
          verified=false
          for bundle_format in false true; do
            echo "::group::cosign verify --new-bundle-format=${bundle_format}"
            if cosign verify "$REF" \
              --certificate-identity "$IDENTITY" \
              --certificate-oidc-issuer "$OIDC_ISSUER" \
              --new-bundle-format="$bundle_format"; then
              verified=true
            fi
            echo "::endgroup::"
          done

          if [ "$verified" != "true" ]; then
            echo "::error::Could not verify the signature of ${REF} against ${IDENTITY}"
            exit 1
          fi

          echo "digest=${REF#*@}" >> "$GITHUB_OUTPUT"
          echo "ref=${REF}" >> "$GITHUB_OUTPUT"

      - name: Pull the upstream policy
        env:
          UPSTREAM_REF: ${{ steps.verify.outputs.ref }}
        run: |
          set -euo pipefail
          kwctl pull "registry://${UPSTREAM_REF}" -o upstream-policy.wasm
          ls -l upstream-policy.wasm

      # ----------------------------------------------------------------------
      # 2. Re-annotate the policy
      # ----------------------------------------------------------------------

      - name: Extract the upstream metadata
        run: |
          set -euo pipefail
          # kwctl shows no signatures unless --show-signatures is given, thus
          # this reads the metadata without a call to the registry.
          kwctl inspect -o yaml upstream-policy.wasm > upstream-metadata.yml
          cat upstream-metadata.yml

      - name: Check that the upstream module matches the release
        run: ./hack/check-upstream-metadata.sh upstream-metadata.yml

      - name: Re-annotate the policy
        env:
          UPSTREAM_DIGEST: ${{ steps.verify.outputs.digest }}
          UPSTREAM_METADATA: upstream-metadata.yml
        run: |
          set -euo pipefail
          # If you do not give --metadata-path, kwctl changes only the given
          # annotations in the metadata of the module. Then kwctl writes one
          # metadata section. The other fields stay as upstream signed them.
          #
          # The step keeps the output of the script in a variable first. A
          # failure inside a process substitution does not stop the step.
          output=$(./hack/annotation-args.sh)
          mapfile -t annotations <<<"$output"
          args=()
          for annotation in "${annotations[@]}"; do
            args+=(--annotation "$annotation")
          done
          kwctl annotate "${args[@]}" -o suse-policy.wasm upstream-policy.wasm

      - name: Check that only provenance metadata changed
        run: |
          set -euo pipefail
          kwctl inspect -o yaml suse-policy.wasm > repackaged-metadata.yml
          ./hack/check-metadata-diff.sh upstream-metadata.yml repackaged-metadata.yml

      - name: Check that the repackaged policy carries the new metadata
        env:
          UPSTREAM_DIGEST: ${{ steps.verify.outputs.digest }}
        run: ./hack/check-repackaged-metadata.sh repackaged-metadata.yml

      # ----------------------------------------------------------------------
      # 3. Push the artifact, unsigned
      # ----------------------------------------------------------------------
      #
      # The push comes before the SBOM, because the SUSE document records the
      # manifest digest of the published artifact. The artifact is not signed
      # yet. Until every check below has passed, nobody can verify it against
      # our identity, so a failure leaves nothing that looks trusted.

      - name: Push the repackaged policy
        id: push
        env:
          GH_TOKEN: ${{ github.token }}
          DESTINATION_REGISTRY: ${{ steps.config.outputs.destination-registry }}
        run: |
          set -euo pipefail
          REF="${DESTINATION_REGISTRY}/${POLICY_ID}:v${POLICY_VERSION}"

          # Record what was published before this run. The clean-up step on
          # failure must not delete an artifact that an earlier run released,
          # which happens on a forced republish and when the new digest is the
          # same as the old one.
          if gh release view "$UPSTREAM_TAG" > /dev/null 2> release-view.err; then
            previously_released=true
          elif grep -q 'release not found' release-view.err; then
            previously_released=false
          else
            cat release-view.err >&2
            echo "::error::Cannot tell whether ${UPSTREAM_TAG} is already released"
            exit 1
          fi
          previous_ref=$(cosign triangulate --type digest "$REF" 2> /dev/null || true)
          previous_digest=""
          if [[ "$previous_ref" == *@sha256:* ]]; then
            previous_digest="${previous_ref#*@}"
          fi
          echo "previously-released=${previously_released}" >> "$GITHUB_OUTPUT"
          echo "previous-digest=${previous_digest}" >> "$GITHUB_OUTPUT"
          echo "Before the push: released=${previously_released}, ${REF} -> '${previous_digest:-<none>}'"

          IMMUTABLE_REF=$(kwctl push -o json suse-policy.wasm "$REF" | jq -r .immutable_ref)
          echo "Pushed ${IMMUTABLE_REF}"
          {
            echo "ref=${REF}"
            echo "immutable-ref=${IMMUTABLE_REF}"
            echo "digest=${IMMUTABLE_REF#*@}"
          } >> "$GITHUB_OUTPUT"

      # ----------------------------------------------------------------------
      # 4. Prepare and check the release content
      # ----------------------------------------------------------------------
      #
      # Two documents are released. The upstream one is republished unchanged,
      # so "cosign verify-blob" against the upstream identity keeps working on
      # the file we ship. The SUSE one is generated here and describes the
      # artifact we actually publish, which the upstream document cannot do.
      #
      # Every step in this stage can fail without leaving a signature behind.

      - name: Download the upstream SBOM
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_REPOSITORY: ${{ steps.config.outputs.upstream-repository }}
        run: |
          set -euo pipefail
          gh release download "$UPSTREAM_TAG" \
            --repo "$UPSTREAM_REPOSITORY" \
            --pattern 'policy-sbom.spdx.json' \
            --pattern 'policy-sbom.spdx.jsonl.bundle.sigstore' \
            --dir upstream-sbom

          # A release without SBOM assets is a hard failure: shipping a policy
          # without the provenance upstream published for it would quietly
          # downgrade what consumers get.
          for asset in policy-sbom.spdx.json policy-sbom.spdx.jsonl.bundle.sigstore; do
            if [ ! -s "upstream-sbom/${asset}" ]; then
              echo "::error::${UPSTREAM_TAG} has no ${asset} asset"
              exit 1
            fi
          done

          # Renamed, never rewritten. The release carries both documents, so
          # the names have to differ, but the bytes stay the ones upstream
          # signed.
          cp upstream-sbom/policy-sbom.spdx.json upstream-policy-sbom.spdx.json
          cp upstream-sbom/policy-sbom.spdx.jsonl.bundle.sigstore \
             upstream-policy-sbom.spdx.jsonl.bundle.sigstore

      - name: Verify the upstream SBOM signature
        env:
          IDENTITY: ${{ steps.config.outputs.identity }}
          OIDC_ISSUER: ${{ steps.config.outputs.oidc-issuer }}
        run: |
          set -euo pipefail
          # Verified on the renamed copy, which is the file that reaches the
          # release. That makes this both an authenticity check and a proof
          # that the copy is byte identical to what upstream signed.
          cosign verify-blob upstream-policy-sbom.spdx.json \
            --bundle upstream-policy-sbom.spdx.jsonl.bundle.sigstore \
            --certificate-identity "$IDENTITY" \
            --certificate-oidc-issuer "$OIDC_ISSUER"

      - name: Generate the SUSE SBOM
        env:
          UPSTREAM_REPOSITORY: ${{ steps.config.outputs.upstream-repository }}
          UPSTREAM_DIGEST: ${{ steps.verify.outputs.digest }}
          DEST_IMMUTABLE_REF: ${{ steps.push.outputs.immutable-ref }}
          WASM_FILE: suse-policy.wasm
          WASM_ASSET_NAME: suse-policy.wasm
        run: |
          set -euo pipefail
          ./hack/generate-sbom.sh upstream-policy-sbom.spdx.json policy-sbom.spdx.json
          cat policy-sbom.spdx.json

      - name: Check the SUSE SBOM against the artifacts
        env:
          DEST_IMMUTABLE_REF: ${{ steps.push.outputs.immutable-ref }}
        run: |
          set -euo pipefail
          ./hack/verify-sbom.sh \
            policy-sbom.spdx.json \
            upstream-policy-sbom.spdx.json \
            suse-policy.wasm

      - name: Download the upstream source archive
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_REPOSITORY: ${{ steps.config.outputs.upstream-repository }}
        run: |
          set -euo pipefail
          # The release carries the source of the upstream repository at the
          # commit the module was built from. It is the same archive that the
          # upstream release page offers as "Source code", but upstream does
          # not sign it, so the commit is the only link to check.
          #
          # Resolve the tag to its commit. An annotated tag points at a tag
          # object first, and the tag object points at the commit.
          ref=$(gh api "repos/${UPSTREAM_REPOSITORY}/git/ref/tags/${UPSTREAM_TAG}")
          type=$(jq -r '.object.type' <<<"$ref")
          sha=$(jq -r '.object.sha' <<<"$ref")
          while [ "$type" = "tag" ]; do
            tag_object=$(gh api "repos/${UPSTREAM_REPOSITORY}/git/tags/${sha}")
            type=$(jq -r '.object.type' <<<"$tag_object")
            sha=$(jq -r '.object.sha' <<<"$tag_object")
          done
          if [ "$type" != "commit" ]; then
            echo "::error::${UPSTREAM_TAG} points at a ${type}, not at a commit"
            exit 1
          fi

          # The upstream release workflow records its commit in versionInfo of
          # the root package of the upstream SBOM. The archive must be the
          # source of that commit, or it is not the source of the module.
          sbom_commit=$(jq -r '
            ( [ (.relationships // [])[]
                | select(.relationshipType == "DESCRIBES" and .spdxElementId == "SPDXRef-DOCUMENT")
                | .relatedSpdxElement ]
              + (.documentDescribes // []) | unique ) as $roots
            | [ .packages[] | select(.SPDXID as $id | $roots | index($id)) | .versionInfo ]
            | if length == 1 then .[0] else "" end' upstream-policy-sbom.spdx.json)
          if [ "$sbom_commit" != "$sha" ]; then
            echo "::error::${UPSTREAM_TAG} points at commit ${sha}, but the upstream SBOM records '${sbom_commit}'"
            exit 1
          fi

          # Download by commit, not by tag, so the archive cannot change if
          # the tag moves. GitHub names the top directory of the archive
          # "<owner>-<repo>-<short commit>", which confirms what was served.
          gh api "repos/${UPSTREAM_REPOSITORY}/tarball/${sha}" > upstream-source.tar.gz
          top=$(tar tzf upstream-source.tar.gz | sed -n '1p')
          top="${top%/}"
          prefix="${UPSTREAM_REPOSITORY/\//-}-"
          short="${top#"$prefix"}"
          if [ "$top" = "$short" ] || [ "${#short}" -lt 7 ] || [ "${sha#"$short"}" = "$sha" ]; then
            echo "::error::The source archive has the top directory '${top}', which does not name commit ${sha}"
            exit 1
          fi

          sha256=$(sha256sum upstream-source.tar.gz | cut -d' ' -f1)
          echo "Source archive of ${UPSTREAM_REPOSITORY} at ${sha}, sha256 ${sha256}"
          echo "commit=${sha}" >> "$GITHUB_OUTPUT"
          echo "sha256=${sha256}" >> "$GITHUB_OUTPUT"

      - name: Render the release notes
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_REPOSITORY: ${{ steps.config.outputs.upstream-repository }}
          UPSTREAM_DIGEST: ${{ steps.verify.outputs.digest }}
          DEST_OCI_REF: ${{ steps.push.outputs.immutable-ref }}
          UPSTREAM_SOURCE_COMMIT: ${{ steps.source.outputs.commit }}
          UPSTREAM_SOURCE_SHA256: ${{ steps.source.outputs.sha256 }}
        run: |
          set -euo pipefail
          gh release view "$UPSTREAM_TAG" \
            --repo "$UPSTREAM_REPOSITORY" \
            --json body --jq '.body' > upstream-body.md

          ./hack/render-changelog.sh upstream-body.md > release-notes.md
          cat release-notes.md

      # ----------------------------------------------------------------------
      # 5. Sign
      # ----------------------------------------------------------------------
      #
      # Every check that can run before the release has passed at this point.
      # Only now does anything get our signature.

      - name: Sign the repackaged policy
        env:
          IMMUTABLE_REF: ${{ steps.push.outputs.immutable-ref }}
        run: |
          set -euo pipefail
          # Mirror the two signature formats upstream produces, so that tools
          # which cannot read the v3 bundle format keep working.
          cosign sign --yes --new-bundle-format=false --use-signing-config=false "$IMMUTABLE_REF"
          cosign sign --yes --new-bundle-format=true --use-signing-config=true "$IMMUTABLE_REF"

          # The signatures above cover the OCI artifact in the registry. The
          # module file attached to the release gets its own signature, so it
          # can be verified with "cosign verify-blob" without the registry.
          cosign sign-blob --yes \
            --bundle suse-policy.wasm.bundle.sigstore \
            suse-policy.wasm

      - name: Sign the SUSE SBOM
        run: |
          set -euo pipefail
          cosign sign-blob --yes \
            --bundle policy-sbom.spdx.jsonl.bundle.sigstore \
            policy-sbom.spdx.json

      - name: Attest the SUSE SBOM to the published artifact
        env:
          IMMUTABLE_REF: ${{ steps.push.outputs.immutable-ref }}
        run: |
          set -euo pipefail
          # A release asset is a file on a web page. An attestation lives in
          # the registry next to the artifact, which is where Kubewarden pulls
          # policies from, so this is what makes the SBOM reachable by anything
          # that consumes the module rather than the release.
          cosign attest --yes \
            --type spdxjson \
            --predicate policy-sbom.spdx.json \
            "$IMMUTABLE_REF"

      - name: Verify the published signature
        env:
          IMMUTABLE_REF: ${{ steps.push.outputs.immutable-ref }}
          OIDC_ISSUER: ${{ steps.config.outputs.oidc-issuer }}
          IDENTITY: ${{ steps.config.outputs.own-identity }}
        run: |
          set -euo pipefail

          # Verify our own signatures before advertising the artifact. This
          # catches a misconfigured signing step while the release does not
          # exist yet, instead of after consumers have been pointed at it.
          cosign verify "$IMMUTABLE_REF" \
            --certificate-identity "$IDENTITY" \
            --certificate-oidc-issuer "$OIDC_ISSUER" \
            --new-bundle-format=false \
            > /dev/null

          cosign verify-blob suse-policy.wasm \
            --bundle suse-policy.wasm.bundle.sigstore \
            --certificate-identity "$IDENTITY" \
            --certificate-oidc-issuer "$OIDC_ISSUER"

      - name: Verify the SUSE SBOM signature and attestation
        env:
          IMMUTABLE_REF: ${{ steps.push.outputs.immutable-ref }}
          OIDC_ISSUER: ${{ steps.config.outputs.oidc-issuer }}
          IDENTITY: ${{ steps.config.outputs.own-identity }}
        run: |
          set -euo pipefail

          # Both of our own claims are checked before the release exists, for
          # the same reason the policy signature is: a misconfigured signing
          # step must fail the run, not reach consumers.
          cosign verify-blob policy-sbom.spdx.json \
            --bundle policy-sbom.spdx.jsonl.bundle.sigstore \
            --certificate-identity "$IDENTITY" \
            --certificate-oidc-issuer "$OIDC_ISSUER"

          cosign verify-attestation "$IMMUTABLE_REF" \
            --type spdxjson \
            --certificate-identity "$IDENTITY" \
            --certificate-oidc-issuer "$OIDC_ISSUER" \
            > /dev/null

      # ----------------------------------------------------------------------
      # 6. Publish the release
      # ----------------------------------------------------------------------

      - name: Create the release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # A previous run may have failed after pushing but before releasing.
          # Clean up any draft or partial release so the retry is idempotent.
          if gh release view "$UPSTREAM_TAG" >/dev/null 2>&1; then
            echo "Deleting the existing release for ${UPSTREAM_TAG} before recreating it"
            gh release delete "$UPSTREAM_TAG" --yes --cleanup-tag
          fi

          gh release create "$UPSTREAM_TAG" \
            --title "$UPSTREAM_TAG" \
            --notes-file release-notes.md \
            --latest=false \
            suse-policy.wasm \
            suse-policy.wasm.bundle.sigstore \
            upstream-source.tar.gz \
            policy-sbom.spdx.json \
            policy-sbom.spdx.jsonl.bundle.sigstore \
            upstream-policy-sbom.spdx.json \
            upstream-policy-sbom.spdx.jsonl.bundle.sigstore

      - name: Check the SBOM download location against the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # The only claim in the SUSE SBOM that cannot be checked before the
          # release exists. Everything else is covered by verify-sbom.sh.
          #
          # The check reads the asset list of the release through the API
          # instead of requesting the URL. An unauthenticated request fails
          # for a private repository, and a successful request proves only
          # that some URL answers. The API confirms that the release carries
          # the module, at the address the SBOM records.
          URL=$(jq -r '.packages[0].downloadLocation' policy-sbom.spdx.json)
          ASSET_URL=$(gh release view "$UPSTREAM_TAG" --json assets \
            --jq '.assets[] | select(.name == "suse-policy.wasm") | .url')
          if [ "$ASSET_URL" != "$URL" ]; then
            echo "::error::The downloadLocation recorded in the SBOM is '${URL}', but the release asset is at '${ASSET_URL:-<missing>}'"
            exit 1
          fi
          echo "downloadLocation matches the release asset: ${URL}"

      - name: Summarise
        env:
          DEST_OCI_REF: ${{ steps.push.outputs.immutable-ref }}
          UPSTREAM_DIGEST: ${{ steps.verify.outputs.digest }}
          UPSTREAM_SOURCE_COMMIT: ${{ steps.source.outputs.commit }}
          UPSTREAM_SOURCE_SHA256: ${{ steps.source.outputs.sha256 }}
        run: |
          {
            echo "### Repackaged ${UPSTREAM_TAG}"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Verified upstream digest | \`${UPSTREAM_DIGEST}\` |"
            echo "| Published artifact | \`${DEST_OCI_REF}\` |"
            echo "| Release | ${UPSTREAM_TAG} |"
            echo "| Upstream source commit | \`${UPSTREAM_SOURCE_COMMIT}\` |"
            echo "| Upstream source archive sha256 | \`${UPSTREAM_SOURCE_SHA256}\` |"
            echo "| Upstream SBOM sha256 | \`$(sha256sum upstream-policy-sbom.spdx.json | cut -d' ' -f1)\` |"
            echo "| SUSE SBOM sha256 | \`$(sha256sum policy-sbom.spdx.json | cut -d' ' -f1)\` |"
            echo "| SUSE SBOM namespace | \`$(jq -r .documentNamespace policy-sbom.spdx.json)\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      # ----------------------------------------------------------------------
      # On failure: remove what this run published
      # ----------------------------------------------------------------------
      #
      # The discovery treats a release as "done". A release that a failed run
      # leaves behind is never retried, so it is deleted. The pushed artifact,
      # and the signatures and attestation if the run got that far, are
      # deleted too, so the registry holds nothing that did not pass every
      # check. An artifact that an earlier run released is never deleted.

      - name: Clean up after a failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_OUTCOME: ${{ steps.release.outcome }}
          PUSH_OUTCOME: ${{ steps.push.outcome }}
          REF: ${{ steps.push.outputs.ref }}
          DIGEST: ${{ steps.push.outputs.digest }}
          PREVIOUS_DIGEST: ${{ steps.push.outputs.previous-digest }}
          PREVIOUSLY_RELEASED: ${{ steps.push.outputs.previously-released }}
          DESTINATION_REGISTRY: ${{ steps.config.outputs.destination-registry }}
        run: |
          set -uo pipefail

          # The release step ran and failed, or a later step failed. Either
          # way, a release for this tag must not stay.
          if [[ -n "$RELEASE_OUTCOME" && "$RELEASE_OUTCOME" != "skipped" ]]; then
            if gh release view "$UPSTREAM_TAG" > /dev/null 2>&1; then
              echo "Deleting the release ${UPSTREAM_TAG}"
              gh release delete "$UPSTREAM_TAG" --yes --cleanup-tag \
                || echo "::error::Could not delete the release ${UPSTREAM_TAG}. Delete it by hand, or discovery will never retry it."
            fi
          fi

          if [[ "$PUSH_OUTCOME" != "success" || -z "$DIGEST" ]]; then
            echo "Nothing was pushed, nothing else to clean up"
            exit 0
          fi

          if [[ "$DIGEST" == "$PREVIOUS_DIGEST" ]]; then
            echo "${DIGEST} was already at ${REF} before this run, it is kept"
            exit 0
          fi

          if [[ "$PREVIOUSLY_RELEASED" == "true" ]]; then
            # A forced republish failed. The tag now points at the new digest,
            # and deleting it would leave the tag pointing at nothing.
            echo "::error::${REF} now points at ${DIGEST}, which did not pass every check. Before this run it pointed at '${PREVIOUS_DIGEST:-<unknown>}'. Run the republish again with force, or move the tag back by hand."
            exit 0
          fi

          # The GitHub packages API identifies a package by its owner and its
          # name. The name is the registry path after "ghcr.io/<owner>/".
          pkg_path="${DESTINATION_REGISTRY#*/}/${POLICY_ID}"
          owner="${pkg_path%%/*}"
          package="${pkg_path#*/}"
          encoded=$(jq -rn --arg name "$package" '$name | @uri')
          case "$(gh api "users/${owner}" --jq .type)" in
            Organization) base="orgs/${owner}/packages/container/${encoded}" ;;
            *) base="users/${owner}/packages/container/${encoded}" ;;
          esac

          # The artifact is the version named after its digest. cosign stores
          # signatures, attestations and referrers under tags that start with
          # "sha256-<hex>", the digest with the colon replaced.
          sig_prefix="${DIGEST/:/-}"
          if ! all_versions=$(gh api --paginate --slurp "${base}/versions"); then
            echo "::error::Could not list the versions of ${pkg_path}. Delete ${DIGEST} and its signatures by hand."
            exit 0
          fi
          versions=$(jq -r --arg digest "$DIGEST" --arg prefix "$sig_prefix" '
            .[][]
            | select(.name == $digest or any(.metadata.container.tags[]?; startswith($prefix)))
            | .id' <<<"$all_versions")

          for id in $versions; do
            echo "Deleting version ${id} of ${pkg_path}"
            gh api --silent -X DELETE "${base}/versions/${id}" \
              || echo "::error::Could not delete version ${id} of ${pkg_path}. Delete it by hand."
          done
