name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Cache the tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            bin
            !bin/repackager
          key: tools-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Makefile') }}

      - name: Check the Go formatting
        run: make fmt-check

      - name: Run go vet
        run: make vet

      - name: Run golangci-lint
        run: make lint

      - name: Check the workflows
        run: make actionlint

      - name: Check that the tool pins match
        run: make check-pins

      - name: Check that config.yaml is valid
        run: make check-config

      - name: Check that go.mod and go.sum are tidy
        run: make mod-check

      - name: Check for known vulnerabilities
        run: make vulncheck

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Run the tests
        run: make test
