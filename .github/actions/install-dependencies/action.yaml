name: "Install repackaging dependencies"
description: "Install the binaries needed to verify, repackage and sign upstream policies"
branding:
  icon: "package"
  color: "blue"
runs:
  using: "composite"
  steps:
    - name: Install cosign
      uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

    - name: Read the pinned tool versions
      id: versions
      shell: bash
      run: |
        set -euo pipefail
        {
          echo "kwctl=$(yq -r '.tools.kwctl.version' config.yaml)"
          echo "kwctl-checksum=$(yq -r '.tools.kwctl.checksum' config.yaml)"
          echo "wasm-tools=$(yq -r '.tools.wasm_tools.version' config.yaml)"
          echo "wasm-tools-checksum=$(yq -r '.tools.wasm_tools.checksum' config.yaml)"
        } >> "$GITHUB_OUTPUT"

    - name: Restore the cached tools
      id: cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/.kwctl
          ~/.wasm-tools
        # Both pinned versions are part of the key, so a version bump misses
        # the cache. There is deliberately no restore-keys fallback: a stale
        # binary must never be served under a new pin.
        key: tools-${{ runner.os }}-kwctl-${{ steps.versions.outputs.kwctl }}-wasmtools-${{ steps.versions.outputs.wasm-tools }}

    - name: Install kwctl
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        KWCTL_VERSION: ${{ steps.versions.outputs.kwctl }}
        KWCTL_CHECKSUM: ${{ steps.versions.outputs.kwctl-checksum }}
      run: |
        set -euo pipefail

        ASSET="kwctl-linux-x86_64"
        INSTALL_DIR="$HOME/.kwctl"

        mkdir -p "$INSTALL_DIR"
        curl -sL "https://github.com/kubewarden/kubewarden-controller/releases/download/${KWCTL_VERSION}/${ASSET}.zip" \
          -o "$INSTALL_DIR/$ASSET.zip"
        echo "${KWCTL_CHECKSUM}  $INSTALL_DIR/$ASSET.zip" | sha256sum -c -
        unzip -o "$INSTALL_DIR/$ASSET.zip" -d "$INSTALL_DIR"
        rm "$INSTALL_DIR/$ASSET.zip"

        mv "$INSTALL_DIR/$ASSET" "$INSTALL_DIR/kwctl"
        chmod 755 "$INSTALL_DIR/kwctl"

    - name: Install wasm-tools
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        WASM_TOOLS_VERSION: ${{ steps.versions.outputs.wasm-tools }}
        WASM_TOOLS_CHECKSUM: ${{ steps.versions.outputs.wasm-tools-checksum }}
      run: |
        set -euo pipefail

        ASSET="wasm-tools-${WASM_TOOLS_VERSION}-x86_64-linux"
        INSTALL_DIR="$HOME/.wasm-tools"

        mkdir -p "$INSTALL_DIR"
        curl -sL "https://github.com/bytecodealliance/wasm-tools/releases/download/v${WASM_TOOLS_VERSION}/${ASSET}.tar.gz" \
          -o "$INSTALL_DIR/wasm-tools.tar.gz"
        echo "${WASM_TOOLS_CHECKSUM}  $INSTALL_DIR/wasm-tools.tar.gz" | sha256sum -c -
        tar xzf "$INSTALL_DIR/wasm-tools.tar.gz" -C "$INSTALL_DIR"
        rm "$INSTALL_DIR/wasm-tools.tar.gz"

        mv "$INSTALL_DIR/${ASSET}/wasm-tools" "$INSTALL_DIR/wasm-tools"
        rm -rf "$INSTALL_DIR/${ASSET}"
        chmod 755 "$INSTALL_DIR/wasm-tools"

    # The two steps above are skipped on a cache hit, so the PATH must be set
    # here instead of inside them.
    - name: Add the tools to the PATH
      shell: bash
      run: |
        set -euo pipefail
        echo "$HOME/.kwctl" >> "$GITHUB_PATH"
        echo "$HOME/.wasm-tools" >> "$GITHUB_PATH"

    - name: Show the tool versions
      shell: bash
      run: |
        set -euo pipefail
        "$HOME/.kwctl/kwctl" --version
        "$HOME/.wasm-tools/wasm-tools" --version
